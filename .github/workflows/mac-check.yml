# Mac version を GitHub の Mac で作り、起動して地図を開けるかを確かめる（手で実行する）
# 2 つとも起動できたら、できた zip を Releases の v<package.json の version> に置く
#   その版の Releases がまだなければ、下書き（Draft）を作って置く。同じ名前のファイルがあれば置き換える
#   置きたくないときは、実行するときに「Releases に置く」のチェックを外す（zip はこの実行の「Artifacts」に残る）
name: mac-check
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Releases に置く'
        type: boolean
        default: true
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple シリコン
            arch: arm64
          - runner: macos-14   # Intel version も Apple シリコンの機械で作る（起動の確認は Rosetta で動く）
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 作る（署名なし。配布物と同じ設定）
        run: |
          node build.mjs
          node build/gen-licenses.cjs
          npx electron-builder --mac zip --${{ matrix.arch }} --publish never
      - name: 起動して地図を開く
        run: |
          APP=$(ls -d release/mac*/"LiDAR Viewer.app" | head -1)
          echo "APP=$APP"
          codesign -dv "$APP" 2>&1 || true
          export PCDV_USERDATA="$RUNNER_TEMP/ud"
          "$APP/Contents/MacOS/LiDAR Viewer" "$PWD/sample/formats/cc_cloud.csv" > app.log 2>&1 &
          P=$!
          sleep 25
          screencapture -x screen.png || true
          if kill -0 $P 2>/dev/null; then echo "起動したまま動いています"; else echo "起動しなかった、または落ちました"; cat app.log; exit 1; fi
          kill $P; sleep 3
          cat app.log
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-zip
          path: release/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-${{ matrix.arch }}
          path: |
            screen.png
            app.log
  release:
    # 2 つとも起動の確認が通ったときだけ置く
    needs: mac
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*-zip
          path: out
          merge-multiple: true
      - name: Releases に置く
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          ls -la out
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG の Releases に置きます"
          else
            echo "$TAG の Releases がないので、下書きを作ります"
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "LiDAR Viewer $V" --notes ""
          fi
          gh release upload "$TAG" out/LiDARViewer-*-mac-*.zip --clobber
          gh release view "$TAG" --json isDraft,assets --jq '"下書き: \(.isDraft)", (.assets[].name)'
